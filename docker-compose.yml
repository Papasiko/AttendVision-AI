services:
  api:
    build: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://attendvision:attendvision_dev@db:5432/attendvision
      API_CORS_ORIGINS: http://localhost:3000
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-change-this-admin-token-before-deployment}
      DEVICE_API_TOKEN: ${DEVICE_API_TOKEN:-change-this-device-token-before-deployment}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: attendvision
      POSTGRES_USER: attendvision
      POSTGRES_PASSWORD: attendvision_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendvision -d attendvision"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
