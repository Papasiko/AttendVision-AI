name: AttendVision CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: DATABASE_URL=sqlite:///./migration-check.db alembic upgrade head
      - run: pytest -q
      - name: Validate Docker Compose and build API image
        working-directory: ..
        env:
          ADMIN_API_TOKEN: ci-admin-token-not-for-production
          DEVICE_API_TOKEN: ci-device-token-not-for-production
          POSTGRES_PASSWORD: 0123456789abcdef0123456789abcdef
        run: |
          docker compose config --quiet
          docker compose build api
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm audit --omit=dev --audit-level=high
      - name: Report development dependency advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const a=require('/tmp/npm-audit.json'); for (const [n,v] of Object.entries(a.vulnerabilities || {})) console.log(n + ': ' + v.severity + '; direct=' + v.isDirect + '; fix=' + JSON.stringify(v.fixAvailable))"
      - run: npm run lint
      - run: npm run build
